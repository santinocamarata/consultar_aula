<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encontrá tu aula | Examen de Ingreso</title>
<style>
  :root {
    /* Paleta institucional real de UADE (navy + coral), verificada contra
       uade.edu.ar — no es un azul genérico de SaaS. */
    --navy: #0a2f63;
    --navy-deep: #061b3d;
    --navy-line: #1c3e6e;
    --coral: #ee6e73;
    --coral-deep: #c94a50;
    --paper: #f4f6fa;
    --mist: #e3e8f1;
    --ink: #10192b;
    --ink-muted: #5c6b84;
    --on-navy: #eef2f9;
    --on-navy-muted: #93a4c4;
    --radius-lg: 20px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow-card: 0 16px 40px rgba(10, 47, 99, 0.12);
    --shadow-soft: 0 2px 10px rgba(10, 47, 99, 0.06);
    --font-body: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, "Courier New", monospace;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font-body);
    background: var(--paper);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .app {
    width: 100%;
    max-width: 460px;
  }

  /* ---------- Encabezado: eyebrow + regla coral, sin ícono-badge ---------- */
  .brand {
    text-align: center;
    margin-bottom: 22px;
  }

  .brand .rule {
    width: 34px;
    height: 3px;
    background: var(--coral);
    border-radius: 2px;
    margin: 0 auto 12px;
  }

  .brand .eyebrow {
    margin: 0 0 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .brand h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: var(--navy);
  }

  /* ---------- Tarjeta de entrada ---------- */
  .card {
    background: #fff;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 28px 24px;
  }

  .welcome-msg {
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--ink-muted);
    text-align: center;
    margin: 0 0 22px;
  }

  .field-group {
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 8px;
  }

  #legajoInput {
    width: 100%;
    padding: 14px 16px;
    font-family: var(--font-mono);
    font-size: 19px;
    letter-spacing: 2px;
    background: var(--paper);
    border: 1.5px solid var(--mist);
    border-radius: var(--radius-md);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    text-align: center;
    font-weight: 700;
    color: var(--navy);
  }

  #legajoInput::placeholder {
    color: #aab4c8;
    font-weight: 500;
  }

  #legajoInput:focus {
    background: #fff;
    border-color: var(--coral);
    box-shadow: 0 0 0 4px rgba(238, 110, 115, 0.18);
  }

  #legajoInput.invalid {
    border-color: var(--coral-deep);
  }

  button#consultarBtn {
    width: 100%;
    padding: 14px 16px;
    margin-top: 4px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
    color: #fff;
    background: var(--navy);
    border: none;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: background-color 0.15s ease, transform 0.1s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  button#consultarBtn:hover {
    background: var(--navy-deep);
  }

  button#consultarBtn:active {
    transform: scale(0.96);
  }

  button#consultarBtn:focus-visible {
    outline: 2px solid var(--coral);
    outline-offset: 2px;
  }

  button#consultarBtn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  #resultado:not(:empty) {
    margin-top: 20px;
  }

  /* ---------- Estado: buscando ---------- */
  .result-box.loading {
    background: var(--paper);
    border: 1px dashed var(--mist);
    border-radius: var(--radius-md);
    padding: 16px;
    color: var(--ink-muted);
    font-size: 13.5px;
    font-weight: 600;
    text-align: center;
    animation: pulse 1.4s ease-in-out infinite;
  }

  /* ---------- Estado: error / no encontrado ---------- */
  .result-box.error {
    background: #fdf1f1;
    border-radius: var(--radius-md);
    padding: 16px 18px;
    color: var(--coral-deep);
    font-size: 13.5px;
    line-height: 1.5;
    text-align: center;
    font-weight: 600;
  }

  /* ---------- Estado: éxito — el "tablero de acceso" ---------- */
  .board {
    background: var(--navy-deep);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: var(--shadow-card);
    animation: riseIn 0.35s ease-out both;
  }

  .board-status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--coral);
    color: var(--navy-deep);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  .board-name .label,
  .board-edificio .label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--on-navy-muted);
    margin-bottom: 3px;
  }

  .board-name {
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px dashed var(--navy-line);
  }

  .board-name .value {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--on-navy);
  }

  .board-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
    perspective: 600px;
  }

  .board-item {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--navy-line);
    border-radius: var(--radius-sm);
    padding: 12px 8px;
    text-align: center;
  }

  .board-item .label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--on-navy-muted);
    margin-bottom: 4px;
  }

  .board-item .value {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: clamp(20px, 6.5vw, 30px);
    font-weight: 700;
    color: var(--on-navy);
    white-space: nowrap;
    letter-spacing: 0.5px;
    animation: flipIn 0.45s cubic-bezier(0.2, 0, 0, 1) both;
    transform-origin: 50% 100%;
  }

  .board-item:nth-child(2) .value {
    animation-delay: 90ms;
  }

  .board-edificio {
    text-align: center;
  }

  .board-edificio .value {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--on-navy);
  }

  /* ---------- Aviso complementario, debajo del tablero ---------- */
  .notice {
    background: #fff;
    border-radius: var(--radius-md);
    padding: 16px 18px;
    margin-top: 14px;
    box-shadow: var(--shadow-soft);
  }

  .notice-title {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
    margin: 0 0 10px;
  }

  .notice-title svg {
    flex-shrink: 0;
    color: var(--coral);
  }

  .notice-list {
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 13px;
    line-height: 1.55;
    color: var(--ink-muted);
  }

  .notice-list li {
    position: relative;
    padding-left: 16px;
    margin-bottom: 6px;
  }

  .notice-list li:last-child {
    margin-bottom: 0;
  }

  .notice-list li::before {
    content: "–";
    position: absolute;
    left: 0;
    color: var(--coral-deep);
    font-weight: 700;
  }

  footer {
    text-align: center;
    margin-top: 22px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: var(--ink-muted);
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes flipIn {
    from { opacity: 0; transform: rotateX(-90deg); }
    to { opacity: 1; transform: rotateX(0deg); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  @media (prefers-reduced-motion: reduce) {
    .board, .board-item .value, .result-box.loading {
      animation: none;
    }
  }

  @media (max-width: 400px) {
    .card { padding: 22px 18px; }
    .board { padding: 16px; }
    .board-grid { gap: 8px; }
    .board-item { padding: 10px 6px; }
  }

  @media (max-width: 340px) {
    .brand h1 { font-size: 22px; }
    .welcome-msg { font-size: 13.5px; }
  }
</style>

<div class="app">
  <div class="brand">
    <div class="rule"></div>
    <p class="eyebrow">UADE · Examen de Ingreso</p>
    <h1>Encontrá tu aula</h1>
  </div>

  <div class="card">
    <p class="welcome-msg">
      Ingresa tu número de legajo para saber el aula en el cual rendirás el examen de ingreso.
    </p>

    <div class="field-group">
      <label for="legajoInput">Número de legajo</label>
      <input
        type="text"
        id="legajoInput"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Ej: 123456"
        maxlength="7"
      />
    </div>

    <button id="consultarBtn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Consultar aula
    </button>

    <div id="resultado"></div>
  </div>

  <footer>UADE · Departamento de Ingreso</footer>
</div>

<script>
  // ---------------------------------------------------------------------
  // CONFIGURACIÓN: Google Sheet publicado como CSV con la asignación real
  // de cada legajo. La hoja debe tener 3 columnas con estos encabezados
  // exactos en la primera fila: Legajo | Piso | Aula
  //
  // Cómo conseguir esta URL: en el Sheet, Archivo > Compartir > Publicar
  // en la Web > elegir la hoja > formato CSV > Publicar. Pegar acá la URL
  // resultante (termina en "output=csv"). Cada vez que se agregue o
  // modifique una fila en el Sheet, el sistema la va a reflejar sola en
  // la próxima consulta, sin necesidad de tocar este archivo.
  // ---------------------------------------------------------------------
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1HFjfXOpvQafRl2Jnq-bihAXzbK-RnxkGphu52jE0C7M/export?format=csv&gid=985193453";

  const PUNTOS_INSTRUCCIONES = [
    "El examen se rinde en el edificio UADE Labs.",
    "Al llegar, podrás utilizar las escaleras o los ascensores para dirigirte al aula.",
    "Recordá tener instalada la aplicación de UADE en tu celular, ya que necesitarás el código QR para ingresar al edificio.",
    "Te recomendamos llegar con anticipación para realizar el ingreso y dirigirte al aula con tiempo.",
  ];

  const MIN_DIGITOS = 1;
  const MAX_DIGITOS = 7;

  const legajoInput = document.getElementById("legajoInput");
  const consultarBtn = document.getElementById("consultarBtn");
  const resultadoDiv = document.getElementById("resultado");

  // Bloquea en tiempo real cualquier caracter que no sea un dígito,
  // y limita la longitud a MAX_DIGITOS mientras el usuario tipea.
  legajoInput.addEventListener("input", () => {
    const soloNumeros = legajoInput.value.replace(/\D/g, "").slice(0, MAX_DIGITOS);
    legajoInput.value = soloNumeros;
    legajoInput.classList.remove("invalid");
  });

  // También bloquea el tipeo de teclas no numéricas antes de que lleguen
  // al input (defensa adicional además del filtro en "input").
  legajoInput.addEventListener("keypress", (evento) => {
    if (!/[0-9]/.test(evento.key)) {
      evento.preventDefault();
    }
  });

  legajoInput.addEventListener("keydown", (evento) => {
    if (evento.key === "Enter") {
      consultarBtn.click();
    }
  });

  consultarBtn.addEventListener("click", consultarAula);

  async function consultarAula() {
    const legajoStr = legajoInput.value.trim();

    if (!esLegajoValido(legajoStr)) {
      legajoInput.classList.add("invalid");
      mostrarError("Ingresa un legajo válido: solo números, entre 1 y 7 dígitos.");
      return;
    }

    legajoInput.classList.remove("invalid");
    mostrarCargando();
    consultarBtn.disabled = true;

    try {
      const asignaciones = await obtenerAsignaciones();
      const asignacion = asignaciones.get(legajoStr);

      if (!asignacion) {
        mostrarError("No se encontró tu número de legajo. Verificá que sea el correcto o, en caso de no conocerlo, conectate con el sector de Ingreso.");
      } else {
        mostrarResultado(asignacion);
      }
    } catch (error) {
      mostrarError("No se pudo conectar con el listado de aulas. Intenta nuevamente en unos segundos.");
    } finally {
      consultarBtn.disabled = false;
    }
  }

  function esLegajoValido(valor) {
    if (valor.length < MIN_DIGITOS || valor.length > MAX_DIGITOS) return false;
    return /^[0-9]+$/.test(valor);
  }

  // ---------------------------------------------------------------------
  // LÓGICA DE ASIGNACIÓN
  // Trae el CSV publicado del Google Sheet en cada consulta (así siempre
  // refleja la última versión cargada) y arma un mapa legajo -> {piso, aula}.
  // Se vuelve a pedir cada vez en lugar de cachear una sola vez porque el
  // sistema puede quedar abierto horas en el día del examen mientras el
  // Sheet se sigue completando.
  // ---------------------------------------------------------------------
  async function obtenerAsignaciones() {
    const respuesta = await fetch(SHEET_CSV_URL, { cache: "no-store" });
    if (!respuesta.ok) throw new Error("No se pudo descargar el CSV");

    const textoCsv = await respuesta.text();
    const filas = parsearCsv(textoCsv);

    const mapa = new Map();
    // La primera fila son los encabezados (Legajo, Piso, Aula, Nombre) -> se salta.
    for (let i = 1; i < filas.length; i++) {
      const [legajo, piso, aula, nombre] = filas[i];
      if (!legajo) continue;
      mapa.set(legajo.trim(), {
        piso: (piso || "").trim(),
        aula: (aula || "").trim(),
        nombre: (nombre || "").trim(),
      });
    }
    return mapa;
  }

  // Parser de CSV simple que respeta valores entre comillas (por si algún
  // campo del Sheet trae comas), que es como Google exporta el publicado.
  function parsearCsv(texto) {
    const filas = [];
    let fila = [];
    let valor = "";
    let entreComillas = false;

    for (let i = 0; i < texto.length; i++) {
      const char = texto[i];

      if (entreComillas) {
        if (char === '"' && texto[i + 1] === '"') {
          valor += '"';
          i++;
        } else if (char === '"') {
          entreComillas = false;
        } else {
          valor += char;
        }
      } else if (char === '"') {
        entreComillas = true;
      } else if (char === ",") {
        fila.push(valor);
        valor = "";
      } else if (char === "\n" || char === "\r") {
        if (char === "\r" && texto[i + 1] === "\n") i++;
        fila.push(valor);
        filas.push(fila);
        fila = [];
        valor = "";
      } else {
        valor += char;
      }
    }
    if (valor !== "" || fila.length > 0) {
      fila.push(valor);
      filas.push(fila);
    }
    return filas;
  }

  function mostrarCargando() {
    resultadoDiv.innerHTML = `<div class="result-box loading">Buscando tu aula...</div>`;
  }

  // El primer dígito del número de aula indica el piso (ej: 863 -> 8vo piso).
  // Se usa notación ordinal correcta (8°) en vez de abreviaturas como "vo"/"mo".
  function formatearPiso(aula) {
    return `${aula.charAt(0)}° piso`;
  }

  // Escapa caracteres especiales de HTML antes de insertar en innerHTML.
  // Necesario porque piso/aula vienen de una fuente externa (el Google Sheet):
  // sin esto, un valor malicioso cargado ahí ejecutaría HTML/JS en el navegador
  // de cada alumno que consulte (XSS almacenado).
  function escapeHtml(texto) {
    return String(texto).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function mostrarResultado(asignacion) {
    const piso = escapeHtml(formatearPiso(asignacion.aula));
    const aula = escapeHtml(asignacion.aula);
    const nombre = escapeHtml(asignacion.nombre || "");

    // El nombre solo se muestra si el Sheet trae ese dato para el legajo
    // (algunos listados viejos no lo incluyen todavía).
    const bloqueNombre = nombre
      ? `
        <div class="board-name">
          <div class="label">Nombre del alumno</div>
          <div class="value">${nombre}</div>
        </div>
      `
      : "";

    resultadoDiv.innerHTML = `
      <div class="board">
        <span class="board-status">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Aula asignada
        </span>
        ${bloqueNombre}
        <div class="board-grid">
          <div class="board-item">
            <div class="label">Piso</div>
            <div class="value">${piso}</div>
          </div>
          <div class="board-item">
            <div class="label">Aula</div>
            <div class="value">${aula}</div>
          </div>
        </div>
        <div class="board-edificio">
          <div class="label">Edificio</div>
          <div class="value">UADE Labs</div>
        </div>
      </div>
      <div class="notice">
        <p class="notice-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M12 11v5.5M12 7.8h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          Información importante a tener en cuenta
        </p>
        <ul class="notice-list">
          ${PUNTOS_INSTRUCCIONES.map((punto) => `<li>${punto}</li>`).join("")}
        </ul>
      </div>
    `;
  }

  function mostrarError(mensaje) {
    resultadoDiv.innerHTML = `
      <div class="result-box error">${mensaje}</div>
    `;
  }
</script>
